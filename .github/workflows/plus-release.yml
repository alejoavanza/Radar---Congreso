name: Radar Plus release verification

on:
  push:
    branches: [feat/social-plus-history, main]
    paths:
      - 'static/**'
      - 'templates/**'
      - 'tests/**'
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/plus-release.yml'
  pull_request:
    paths:
      - 'static/**'
      - 'templates/**'
      - 'tests/**'
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/plus-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plus-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Backend tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Shared JavaScript tests
        run: node --test tests/*.test.cjs
      - name: Chromium Android and WebKit iPhone browser profiles
        run: python tests/browser_social_release.py
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Radar-Plus-Web-iOS-Android-Verification
          path: release-evidence/
          retention-days: 14

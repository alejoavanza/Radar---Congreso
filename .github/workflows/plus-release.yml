name: Radar Plus release verification

on:
  push:
    branches: [feat/social-plus-history, feat/real-social-followers, main]
    paths:
      - 'static/**'
      - 'templates/**'
      - 'tests/**'
      - 'migrations/**'
      - 'social_accounts.json'
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/plus-release.yml'
  pull_request:
    paths:
      - 'static/**'
      - 'templates/**'
      - 'tests/**'
      - 'migrations/**'
      - 'social_accounts.json'
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/plus-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plus-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Backend tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Shared JavaScript tests
        run: |
          node --check static/social-followers.js
          node --test tests/*.test.cjs
      - name: Validate SQL in disposable PostgreSQL only
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role;'
          psql -v ON_ERROR_STOP=1 -f migrations/001_follower_snapshots.sql
          psql -v ON_ERROR_STOP=1 -f tests/follower_storage.sql
      - name: Chromium Android and WebKit iPhone browser profiles
        run: python tests/browser_followers_release.py
      - name: Record tested source version
        if: always()
        run: |
          mkdir -p release-evidence
          git rev-parse HEAD > release-evidence/tested-commit.txt
          git archive HEAD -o release-evidence/source.tar
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Radar-Plus-Web-iOS-Android-Verification
          path: release-evidence/
          retention-days: 14
